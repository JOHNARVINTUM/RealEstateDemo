{% load static %}
<aside id="tenantSidebar" class="w-72 tenant-sidebar text-white flex flex-col shadow-xl z-[1000] shrink-0 border-r border-slate-800 transition-transform transform -translate-x-full md:translate-x-0 duration-300">

  <!-- Brand -->
  <div class="px-6 py-8 border-b border-slate-800 brand-container transition-all duration-300 overflow-hidden">
    <!-- Header: Logo + Name -->
    <div class="flex items-center gap-3 mb-5 brand-header">
      <div class="w-11 h-11 bg-white rounded-xl flex justify-center items-center shrink-0 shadow-sm p-1.5 transition-all duration-300 tenant-brand-logo">
        <img src="{% static 'img/accounts/RealEstate360+ Logo2 jpg.jpg' %}" alt="Logo" class="w-full h-full object-contain">
      </div>
      <div class="text-xl font-semibold tracking-tight text-white brand-name whitespace-nowrap -mt-2.5 font-display">
        RealEstate360<span class="text-blue-500">+</span>
      </div>
    </div>
    <!-- Tenant Portal Label Section -->
    <div class="brand-text transition-all duration-300 overflow-hidden">
      <span class="text-[10px] text-blue-400 font-bold tracking-widest uppercase block bg-slate-800/80 px-2.5 py-1 rounded border border-slate-700/60 w-fit">
        Tenant Portal
      </span>
    </div>
  </div>

  <!-- Nav -->
  <nav class="px-4 py-8 space-y-2 flex-1 overflow-x-hidden" aria-label="Tenant navigation">

    <a href="{% url 'tenant_dashboard' %}"
       class="nav-item flex items-center gap-4 px-6 py-4 rounded-2xl font-black text-base transition-all overflow-hidden whitespace-nowrap
              {% if request.resolver_match.url_name == 'tenant_dashboard' %}
                active
              {% else %}
                text-slate-400 hover:text-white
              {% endif %}">
      <!-- Home icon -->
      <svg class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="nav-text transition-all duration-300">Home</span>
    </a>

    <a href="{% url 'tenant_notifications' %}"
       class="nav-item flex items-center gap-4 px-6 py-4 rounded-2xl font-black text-base transition-all overflow-hidden whitespace-nowrap
              {% if request.resolver_match.url_name == 'tenant_notifications' %}
                active
              {% else %}
                text-slate-400 hover:text-white
              {% endif %}">
      <!-- Notification icon -->
      <div class="relative shrink-0">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        {% if unread_notification_count and unread_notification_count > 0 %}
          <span class="absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white text-[10px] font-black rounded-full flex items-center justify-center">{{ unread_notification_count }}</span>
        {% endif %}
      </div>
      <span class="nav-text transition-all duration-300">Notifications</span>
    </a>

    <a href="{% url 'tenant_billing' %}"
       class="nav-item flex items-center gap-4 px-6 py-4 rounded-2xl font-black text-base transition-all overflow-hidden whitespace-nowrap
              {% if request.resolver_match.url_name == 'tenant_billing' %}
                active
              {% else %}
                text-slate-400 hover:text-white
              {% endif %}">
      <!-- Bills icon -->
      <svg class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span class="nav-text transition-all duration-300">Bills</span>
    </a>

    <a href="{% url 'tenant_pay_advance' %}"
       class="nav-item flex items-center gap-4 px-6 py-4 rounded-2xl font-black text-base transition-all overflow-hidden whitespace-nowrap
              {% if request.resolver_match.url_name == 'tenant_pay_advance' or request.resolver_match.url_name == 'manual_gcash' %}
                active
              {% else %}
                text-slate-400 hover:text-white
              {% endif %}">
      <!-- Payment icon -->
      <svg class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
      </svg>
      <span class="nav-text transition-all duration-300">Make a Payment</span>
    </a>

    <a href="{% url 'maintenance_list' %}"
       class="nav-item flex items-center gap-4 px-6 py-4 rounded-2xl font-black text-base transition-all overflow-hidden whitespace-nowrap
              {% if request.resolver_match.url_name == 'maintenance_list' %}
                active
              {% else %}
                text-slate-400 hover:text-white
              {% endif %}">
      <!-- Repairs icon -->
      <svg class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span class="nav-text transition-all duration-300">My Repairs</span>
    </a>

    <a href="{% url 'report_issue' %}"
       class="nav-item flex items-center gap-4 px-6 py-4 rounded-2xl font-black text-base transition-all overflow-hidden whitespace-nowrap
              {% if request.resolver_match.url_name == 'report_issue' %}
                active
              {% else %}
                text-slate-400 hover:text-white
              {% endif %}">
      <!-- Report icon -->
      <svg class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span class="nav-text transition-all duration-300">Report a Problem</span>
    </a>

  </nav>

  <!-- Toggle Button -->
  <div class="px-4 pb-4 overflow-hidden">
    <button id="tenantSidebarToggle" class="w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-black text-base text-slate-500 hover:bg-slate-800 hover:text-white transition-all overflow-hidden whitespace-nowrap">
      <svg class="w-6 h-6 shrink-0 transition-transform duration-300" id="tenantToggleIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
      <span class="nav-text transition-all duration-300">Hide Sidebar</span>
    </button>
  </div>

  <!-- Logout -->
  <div class="px-4 py-4 border-t-2 border-slate-800/50 overflow-hidden">
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit"
              class="w-full text-left flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-500 hover:bg-rose-500 hover:text-white transition-all font-black text-base overflow-hidden whitespace-nowrap">
        <svg class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="nav-text transition-all duration-300">Sign Out</span>
      </button>
    </form>
  </div>

</aside>
