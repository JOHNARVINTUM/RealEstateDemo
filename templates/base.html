<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block meta_description %}RealEstate360+ — Property Management Portal{% endblock %}">
  <title>{% block title %}RealEstate360+{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['MuseoModerno', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Design System - CSS Custom Properties */
    :root {
      /* Colors */
      --color-primary: #172554;
      --color-primary-light: #1e3a8a;
      --color-primary-dark: #0f172a;
      --color-secondary: #22c55e;
      --color-secondary-light: #4ade80;
      --color-accent: #3b82f6;
      --color-accent-light: #60a5fa;
      
      /* Neutral Colors */
      --color-gray-50: #f8fafc;
      --color-gray-100: #f1f5f9;
      --color-gray-200: #e2e8f0;
      --color-gray-300: #cbd5e1;
      --color-gray-400: #94a3b8;
      --color-gray-500: #64748b;
      --color-gray-600: #475569;
      --color-gray-700: #334155;
      --color-gray-800: #1e293b;
      --color-gray-900: #0f172a;
      
      /* Semantic Colors */
      --color-success: #22c55e;
      --color-success-bg: #dcfce7;
      --color-warning: #f59e0b;
      --color-warning-bg: #fef3c7;
      --color-error: #ef4444;
      --color-error-bg: #fee2e2;
      --color-info: #3b82f6;
      --color-info-bg: #eff6ff;
      
      /* Spacing Scale */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --space-20: 5rem;
      
      /* Border Radius */
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.5rem;
      --radius-full: 9999px;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      
      /* Typography */
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 1.875rem;
      --font-size-4xl: 2.25rem;
      
      /* Line Heights */
      --line-height-tight: 1.25;
      --line-height-normal: 1.5;
      --line-height-relaxed: 1.75;
      
      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-normal: 0.2s ease;
      --transition-slow: 0.3s ease;
    }
    
    /* Base Styles */
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: var(--line-height-normal);
      color: var(--color-gray-800);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Shared animation utilities referenced by tenant templates */
    .fade-in,
    .animate-fade-in {
      animation: fadeInUp 0.35s ease both;
    }
    
    @keyframes fadeInUp {
      from { 
        opacity: 0; 
        transform: translateY(8px); 
      }
      to   { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    
    @keyframes slideInRight {
      from { 
        opacity: 0; 
        transform: translateX(16px); 
      }
      to   { 
        opacity: 1; 
        transform: translateX(0); 
      }
    }
    
    /* Utility Classes */
    .text-gradient {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .card-hover {
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
    }
    
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      color: white;
      border: none;
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius-xl);
      font-weight: 600;
      transition: all var(--transition-normal);
      box-shadow: var(--shadow-md);
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-lg);
    }
    
    .btn-primary:active {
      transform: translateY(0);
    }
    
    /* Focus Styles for Accessibility */
    .focus-ring:focus {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    
    .focus-ring:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <script>
    // Global Form Validation Logic
    document.addEventListener('DOMContentLoaded', function() {
      const forms = document.querySelectorAll('form');
      
      function getOrCreateErrorElement(input) {
        let errorEl = input.nextElementSibling;
        if (!errorEl || !errorEl.classList.contains('global-validation-error')) {
          errorEl = document.createElement('div');
          errorEl.className = 'global-validation-error';
          errorEl.style.color = 'red';
          errorEl.style.fontSize = '12px';
          errorEl.style.marginTop = '4px';
          input.parentNode.insertBefore(errorEl, input.nextSibling);
        }
        return errorEl;
      }

      function clearError(input, errorEl) {
        errorEl.textContent = '';
        input.style.borderColor = 'green';
      }

      function setError(input, errorEl, message) {
        errorEl.textContent = message;
        input.style.borderColor = 'red';
      }

      function validateEmail(input) {
        const val = input.value;
        if (!val) return true;
        if (val.includes(' ')) return 'Email cannot contain spaces.';
        const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!pattern.test(val)) return 'Must follow proper email format (name@domain.com).';
        return true;
      }

      function validatePhone(input) {
        const val = input.value;
        if (!val) return true;
        if (!/^\d{11}$/.test(val)) return 'Must be exactly 11 digits (e.g., 09123456789).';
        return true;
      }

      function validateAmount(input) {
        const val = input.value;
        if (!val) return true;
        const numStr = val.replace(/,/g, '');
        const num = parseFloat(numStr);
        if (isNaN(num)) return 'Must be a valid number.';
        if (num > 1000000) return 'Amount cannot exceed 1,000,000.';
        return true;
      }

      function validateSlots(input) {
        const val = input.value;
        if (!val) return true;
        const num = parseInt(val, 10);
        if (isNaN(num)) return 'Must be a valid number.';
        if (num < 0 || num > 10) return 'Cannot exceed 10 slots.';
        return true;
      }

      function validatePersonName(input) {
        const val = input.value;
        if (!val) return true;
        if (/[^a-zA-Z\s\-\.]/.test(val)) return 'Must contain letters only. No numbers or special characters.';
        return true;
      }

      function validateReference(input) {
        const val = input.value;
        if (!val) return true;
        if (!/^\d{13}$/.test(val)) return 'Must be exactly 13 digits. Numbers only.';
        return true;
      }

      document.querySelectorAll('input').forEach(input => {
        const type = (input.type || '').toLowerCase();
        const name = (input.name || '').toLowerCase();
        const id = (input.id || '').toLowerCase();

        let validationType = null;

        if (type === 'email' || name.includes('email')) {
          validationType = 'email';
        } else if (name.includes('phone') || name.includes('contact') || id.includes('phone') || id.includes('contact')) {
          validationType = 'phone';
        } else if (name.includes('amount') || id.includes('amount') || name.includes('rent') || name.includes('deposit')) {
          validationType = 'amount';
        } else if (name.includes('slots') || id.includes('slots')) {
          validationType = 'slots';
        } else if (name === 'first_name' || name === 'last_name' || name === 'name') {
          validationType = 'personName';
        } else if (name.includes('reference') || id.includes('reference')) {
          // Only apply strict 13-digit rule to GCash references, not cash receipts
          if (!name.includes('cash') && !id.includes('cash')) {
            validationType = 'reference';
          }
        }

        if (validationType) {
          input.dataset.validationType = validationType;
          
          input.addEventListener('input', function() {
            const errorEl = getOrCreateErrorElement(input);
            let result = true;
            if (validationType === 'email') result = validateEmail(input);
            else if (validationType === 'phone') result = validatePhone(input);
            else if (validationType === 'amount') result = validateAmount(input);
            else if (validationType === 'slots') result = validateSlots(input);
            else if (validationType === 'personName') result = validatePersonName(input);
            else if (validationType === 'reference') result = validateReference(input);

            if (result === true) {
              if (input.value) clearError(input, errorEl);
              else {
                errorEl.textContent = '';
                input.style.borderColor = '';
              }
            } else {
              setError(input, errorEl, result);
            }
          });
        }
      });

      forms.forEach(form => {
        form.addEventListener('submit', function(e) {
          let isValid = true;
          const inputsToValidate = form.querySelectorAll('input[data-validation-type]');
          
          inputsToValidate.forEach(input => {
            const type = input.dataset.validationType;
            const errorEl = getOrCreateErrorElement(input);
            let result = true;
            
            if (type === 'email') result = validateEmail(input);
            else if (type === 'phone') result = validatePhone(input);
            else if (type === 'amount') result = validateAmount(input);
            else if (type === 'slots') result = validateSlots(input);
            else if (type === 'personName') result = validatePersonName(input);
            else if (type === 'reference') result = validateReference(input);

            if (result !== true && input.value) {
              setError(input, errorEl, result);
              isValid = false;
            }
          });

          if (!isValid) {
            e.preventDefault();
          }
        });
      });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
