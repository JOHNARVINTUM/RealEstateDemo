{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'admin_portal/css/admin.css' %}">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;700;800&family=MuseoModerno:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* Premium & Accessible Tenant Portal Styling */
  
  :root {
    --tenant-primary: #0f172a;
    --tenant-bg: #f8fafc;
    --tenant-card-bg: #ffffff;
    --tenant-border: #e2e8f0;
  }

  body {
    font-family: 'Inter', sans-serif;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 {
    font-family: 'Outfit', sans-serif;
  }

  .font-display {
    font-family: 'MuseoModerno', sans-serif;
  }
  
  /* Form Field Styling - Larger & Clearer */
  .tenant-form select,
  .tenant-form input[type="text"],
  .tenant-form input[type="email"],
  .tenant-form input[type="password"],
  .tenant-form input[type="number"],
  .tenant-form input[type="tel"],
  .tenant-form textarea {
    width: 100%;
    border: 2px solid #e2e8f0;
    border-radius: 1rem;
    padding: 1rem 1.25rem;
    background-color: #ffffff;
    transition: all 0.2s ease;
    font-size: 1.125rem;
    color: #0f172a;
    font-weight: 600;
  }
  
  .tenant-form select:focus,
  .tenant-form input[type="text"]:focus,
  .tenant-form input[type="email"]:focus,
  .tenant-form input[type="password"]:focus,
  .tenant-form input[type="number"]:focus,
  .tenant-form input[type="tel"]:focus,
  .tenant-form textarea:focus {
    border-color: #0f172a;
    outline: none;
    box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
  }
  
  /* Form Labels - Bold & Readable */
  .tenant-form label {
    display: block;
    margin-bottom: 0.75rem;
    color: #0f172a;
    font-size: 1.125rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  
  /* Form Buttons - Premium Feel */
  .tenant-form button[type="submit"] {
    background-color: #0f172a;
    color: white;
    border: none;
    padding: 1.25rem 2.5rem;
    border-radius: 1.25rem;
    font-weight: 900;
    font-size: 1.25rem;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15);
  }
  
  .tenant-form button[type="submit"]:hover {
    background-color: #1e293b;
    transform: translateY(-2px);
    box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.2);
  }

  .tenant-form button[type="submit"]:active {
    transform: translateY(0);
  }
  
  /* Messages - High Contrast */
  .tenant-form .errorlist {
    list-style: none;
    padding: 0;
    margin: 1rem 0 0 0;
  }
  
  .tenant-form .errorlist li {
    background-color: #fef2f2;
    color: #991b1b;
    padding: 1rem 1.25rem;
    border-radius: 1rem;
    font-size: 1rem;
    font-weight: 700;
    border-left: 6px solid #dc2626;
  }
  
  .tenant-form .success-message {
    background-color: #f0fdf4;
    color: #166534;
    padding: 1.25rem 1.5rem;
    border-radius: 1rem;
    font-size: 1.125rem;
    font-weight: 700;
    border-left: 6px solid #16a34a;
    margin-bottom: 2rem;
  }
  
  /* Premium Cards */
  .tenant-card {
    background: #ffffff;
    border: 2px solid #f1f5f9;
    border-radius: 2rem;
    padding: 2.5rem;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.04);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  /* Readable Status Badges */
  .status-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.5rem 1rem;
    border-radius: 0.75rem;
    font-size: 0.875rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  /* Sidebar - Dark & Sleek */
  .tenant-sidebar {
    background-color: #0f172a;
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    height: 100vh !important;
    z-index: 1000 !important;
    overflow-y: auto !important;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }
  
  .tenant-sidebar .nav-item {
    transition: all 0.2s ease;
    margin: 0.25rem 0;
  }
  
  .tenant-sidebar .nav-item:hover {
    background-color: rgba(255, 255, 255, 0.05);
    color: #ffffff;
  }
  
  .tenant-sidebar .nav-item.active {
    background-color: #3b82f6;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }

  /* Tenant Sidebar Collapse Behavior */
  body.tenant-collapsed .tenant-sidebar {
    width: 100px !important;
  }

  body.tenant-collapsed .tenant-sidebar .brand-text,
  body.tenant-collapsed .tenant-sidebar .nav-text,
  body.tenant-collapsed .tenant-sidebar .brand-name {
    opacity: 0;
    width: 0;
    display: none !important;
  }

  body.tenant-collapsed .tenant-sidebar .brand-header {
    justify-content: center;
  }

  body.tenant-collapsed .tenant-sidebar .tenant-brand-logo {
    width: 56px;
    height: 56px;
  }

  body.tenant-collapsed .tenant-sidebar .nav-item,
  body.tenant-collapsed .tenant-sidebar button {
    justify-content: center;
    padding: 1rem 0;
  }

  body.tenant-collapsed #tenantToggleIcon {
    transform: rotate(180deg);
  }

  /* Main Workspace Offset */
  main.flex-1 {
    margin-left: 288px !important;
    transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }

  body.tenant-collapsed main.flex-1 {
    margin-left: 100px !important;
  }

  /* Background Pattern */
  .tenant-workspace-bg {
    background-color: #f8fafc;
    background-image: 
      radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.03) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.03) 0px, transparent 50%);
  }

  .animate-fade-in {
    animation: fadeIn 0.5s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen flex tenant-workspace-bg">

  {% include "includes/tenant_sidebar.html" %}

  <main class="flex-1 px-8 py-10 overflow-y-auto">
    <div class="max-w-7xl mx-auto animate-fade-in">
      <!-- Django Messages Display -->
      {% if messages %}
        <div class="mb-6 space-y-3">
          {% for message in messages %}
            <div class="{% if message.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-800{% elif message.tags == 'error' %}bg-rose-50 border-rose-200 text-rose-800{% elif message.tags == 'warning' %}bg-amber-50 border-amber-200 text-amber-800{% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %} border px-6 py-4 rounded-2xl flex items-start gap-3">
              <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                {% if message.tags == 'success' %}
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                {% elif message.tags == 'error' %}
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                {% else %}
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                {% endif %}
              </svg>
              <div>
                <p class="font-bold">{{ message }}</p>
              </div>
            </div>
          {% endfor %}
        </div>
      {% endif %}
      
      {% block tenant_content %}{% endblock %}
    </div>
  </main>

</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggleBtn = document.getElementById('tenantSidebarToggle');
    if (toggleBtn) {
      if (localStorage.getItem('tenantSidebarCollapsed') === 'true') {
        document.body.classList.add('tenant-collapsed');
      }

      toggleBtn.addEventListener('click', function () {
        document.body.classList.toggle('tenant-collapsed');
        const isCollapsed = document.body.classList.contains('tenant-collapsed');
        localStorage.setItem('tenantSidebarCollapsed', isCollapsed);
      });
    }
  });
</script>
{% endblock %}
