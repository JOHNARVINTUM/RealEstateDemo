{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'admin_portal/css/admin.css' %}">
<style>
  /* Practical & Authentic Tenant Portal Styling */
  
  /* Form Field Styling */
  .tenant-form select,
  .tenant-form input[type="text"],
  .tenant-form input[type="email"],
  .tenant-form input[type="password"],
  .tenant-form input[type="number"],
  .tenant-form input[type="tel"],
  .tenant-form textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 0.5rem;
    padding: 0.625rem 0.875rem;
    background-color: #ffffff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    font-size: 0.9375rem;
    color: #0f172a;
    font-weight: 500;
  }
  
  .tenant-form select:focus,
  .tenant-form input[type="text"]:focus,
  .tenant-form input[type="email"]:focus,
  .tenant-form input[type="password"]:focus,
  .tenant-form input[type="number"]:focus,
  .tenant-form input[type="tel"]:focus,
  .tenant-form textarea:focus {
    border-color: #0f172a;
    outline: none;
    box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
  }
  
  /* Form Labels */
  .tenant-form label {
    display: block;
    margin-bottom: 0.375rem;
    color: #334155;
    font-size: 0.875rem;
    font-weight: 700;
  }
  
  /* Form Buttons */
  .tenant-form button[type="submit"] {
    background-color: #0f172a;
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    font-weight: 700;
    font-size: 0.9375rem;
    transition: background-color 0.15s ease;
    cursor: pointer;
  }
  
  .tenant-form button[type="submit"]:hover {
    background-color: #1e293b;
  }
  
  /* Messages */
  .tenant-form .errorlist {
    list-style: none;
    padding: 0;
    margin: 0.5rem 0 0 0;
  }
  
  .tenant-form .errorlist li {
    background-color: #fee2e2;
    color: #991b1b;
    padding: 0.5rem 0.75rem;
    border-radius: 0.375rem;
    font-size: 0.875rem;
    font-weight: 600;
    border-left: 3px solid #dc2626;
  }
  
  .tenant-form .success-message {
    background-color: #f0fdf4;
    color: #166534;
    padding: 0.75rem 1rem;
    border-radius: 0.375rem;
    font-size: 0.875rem;
    font-weight: 600;
    border-left: 3px solid #16a34a;
    margin-bottom: 1rem;
  }
  
  /* Practical Cards */
  .tenant-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 0.75rem;
    padding: 1.5rem;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
  }
  
  /* Readable Status Badges */
  .status-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.25rem 0.625rem;
    border-radius: 0.375rem;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.025em;
  }
  
  .status-badge.success {
    background-color: #f0fdf4;
    color: #166534;
    border: 1px solid #bbf7d0;
  }
  
  .status-badge.warning {
    background-color: #fefbeb;
    color: #b45309;
    border: 1px solid #fde68a;
  }
  
  .status-badge.error {
    background-color: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }
  
  .status-badge.info {
    background-color: #f8fafc;
    color: #334155;
    border: 1px solid #e2e8f0;
  }
  
  /* Sidebar */
  .tenant-sidebar {
    background-color: #0f172a;
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    height: 100vh !important;
    z-index: 1000 !important;
    overflow-y: auto !important;
    transition: width 0.3s ease !important;
  }
  
  .tenant-sidebar .nav-item {
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  
  .tenant-sidebar .nav-item:hover {
    background-color: #1e293b;
    color: #ffffff;
  }
  
  .tenant-sidebar .nav-item.active {
    background-color: #1e293b;
    color: #ffffff;
    border-left: 4px solid #3b82f6;
    font-weight: 700;
  }

  /* Tenant Sidebar Collapse Behavior */
  body.tenant-collapsed .tenant-sidebar {
    width: 88px !important;
  }

  body.tenant-collapsed .tenant-sidebar .brand-text,
  body.tenant-collapsed .tenant-sidebar .nav-text {
    opacity: 0;
    width: 0;
    display: none !important;
  }

  body.tenant-collapsed .tenant-sidebar .brand-container {
    padding-left: 0.75rem;
    padding-right: 0.75rem;
  }

  body.tenant-collapsed .tenant-sidebar .brand-header {
    justify-content: center;
  }

  body.tenant-collapsed .tenant-sidebar .tenant-brand-logo {
    width: 44px;
    height: 44px;
  }

  body.tenant-collapsed .tenant-sidebar .brand-name {
    display: none !important;
  }

  body.tenant-collapsed .tenant-sidebar .nav-item,
  body.tenant-collapsed .tenant-sidebar button {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
  }

  body.tenant-collapsed #tenantToggleIcon {
    transform: rotate(180deg);
  }
  
  /* Override neon gradient utilities to map to readable dark text */
  .text-gradient {
    background: none !important;
    -webkit-text-fill-color: initial !important;
    color: #0f172a !important;
  }

  /* Main Workspace Offset for Fixed Sidebar */
  main.flex-1 {
    margin-left: 288px !important;
    transition: margin-left 0.3s ease !important;
  }

  body.tenant-collapsed main.flex-1 {
    margin-left: 88px !important;
  }

  /* Loading State */
  .loading {
    opacity: 0.7;
    pointer-events: none;
  }

  /* Tenant Workspace Background Pattern - Distinct from Admin Squares */
  .tenant-workspace-bg {
    background-color: #f8fafc;
    background-image: radial-gradient(rgba(148, 163, 184, 0.22) 1px, transparent 1px);
    background-size: 28px 28px;
  }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen flex tenant-workspace-bg font-['Poppins',_sans-serif]">

  {% include "includes/tenant_sidebar.html" %}

  <main class="flex-1 px-4 py-6 overflow-y-auto transition-all duration-300">
    <div class="max-w-6xl mx-auto animate-fade-in">
      {% block tenant_content %}{% endblock %}
    </div>
  </main>

</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggleBtn = document.getElementById('tenantSidebarToggle');
    if (toggleBtn) {
      // Load stored state
      if (localStorage.getItem('tenantSidebarCollapsed') === 'true') {
        document.body.classList.add('tenant-collapsed');
      }

      toggleBtn.addEventListener('click', function () {
        document.body.classList.toggle('tenant-collapsed');
        const isCollapsed = document.body.classList.contains('tenant-collapsed');
        localStorage.setItem('tenantSidebarCollapsed', isCollapsed);
      });
    }
  });
</script>
{% endblock %}
